<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Upload Video - LetsCrack</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: Arial; padding: 40px; text-align: center; background: #111; color: white; }
    input, button { padding: 14px 20px; margin: 10px; border-radius: 8px; border: none; font-size: 16px; }
    button { background: #ff0050; color: white; cursor: pointer; font-weight: bold; }
    button:disabled { background: #555; cursor: not-allowed; }
    #status { margin-top: 20px; }
  </style>
</head>
<body>
  <h2>📹 Upload Video to LetsCrack</h2>
  <input type="file" id="videoFile" accept="video/*">
  <br>
  <button onclick="uploadVideo()" id="btn">Upload</button>
  <p id="status"></p>

  <script>
    const SUPABASE_URL = 'https://iprvkotpvdwycmcrjcmy.supabase.co'
    const SUPABASE_ANON_KEY = 'sb_publishable_jIPnwBIXE9zFDcFuoNMGLw_62VrbOJQ'
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

    async function uploadVideo() {
      const file = document.getElementById('videoFile').files[0]
      const status = document.getElementById('status')
      const btn = document.getElementById('btn')
      
      if (!file) return alert('Please pick a video first')

      const fileName = `${Date.now()}-${file.name.replace(/\s/g, '_')}`
      status.innerText = 'Uploading... 0%'
      btn.disabled = true

      const { data, error } = await supabase.storage
     .from('Videos')
     .upload(fileName, file)

      btn.disabled = false

      if (error) {
        status.innerText = 'Upload Error: ' + error.message
        console.error(error)
      } else {
        const { data: urlData } = supabase.storage.from('Videos').getPublicUrl(fileName)
        status.innerHTML = `✅ Upload Success! <br><br> <a href="${urlData.publicUrl}" target="_blank" style="color:#ff0050">Click here to view video</a> <br><br> Now go check your homepage`
      }
    }
  </script>
</body>
</html>
