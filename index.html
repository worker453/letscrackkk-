<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>let'scrackkk - Watch & Upload Videos</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-black text-white">
  <nav class="p-4 flex justify-between border-b border-gray-800 sticky top-0 bg-black">
    <h1 class="text-2xl font-bold text-purple-500">let'scrackkk</h1>
    <div>
      <button onclick="showUpload()" class="bg-purple-600 px-4 py-2 rounded">Upload</button>
      <button onclick="logout()" class="ml-2">Logout</button>
    </div>
  </nav>

  <!-- TABS -->
  <div class="flex border-b border-gray-800">
    <button onclick="showFeed('short')" class="flex-1 p-3 font-bold">Shorts</button>
    <button onclick="showFeed('long')" class="flex-1 p-3 font-bold text-gray-400">Videos</button>
  </div>

  <div id="video-feed" class="p-4"></div>

<script>
const SUPABASE_URL = "YOUR_SUPABASE_URL"
const SUPABASE_KEY = "YOUR_SUPABASE_KEY"
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY)

let currentFeed = 'short'

async function loadVideos(type) {
  const { data } = await supabase.from('videos').select('*').eq('video_type', type).order('created_at', {ascending: false})
  const feed = document.getElementById('video-feed')
  
  if(type === 'short') {
    // TIKTOK STYLE - vertical, 1 video at a time
    feed.className = "p-4 snap-y snap-mandatory overflow-y-scroll h-screen"
    feed.innerHTML = data.map(v => `
      <div class="snap-start h-screen flex flex-col justify-center">
        <video src="${v.video_url}" controls autoplay loop muted playsinline class="w-full max-w-md mx-auto rounded-lg"></video>
        <h3 class="font-bold mt-2 text-center">${v.title}</h3>
        <p class="text-sm text-gray-400 text-center">by ${v.username}</p>
        <div class="flex justify-center gap-6 mt-3">
          <button>❤️ ${v.likes}</button>
          <button>💬</button>
          <a href="${v.video_url}" download class="text-green-400">⬇️</a>
        </div>
      </div>
    `).join('')
  } else {
    // YOUTUBE STYLE - grid
    feed.className = "p-4 grid md:grid-cols-3 gap-4"
    feed.innerHTML = data.map(v => `
      <div class="bg-gray-900 rounded-lg p-3">
        <video src="${v.video_url}" controls class="w-full rounded"></video>
        <h3 class="font-bold mt-2">${v.title}</h3>
        <p class="text-sm text-gray-400">by ${v.username}</p>
        <div class="flex gap-4 mt-2">
          <button>❤️ ${v.likes}</button>
          <button>💬</button>
          <a href="${v.video_url}" download class="text-green-400">⬇️ Download</a>
        </div>
      </div>
    `).join('')
  }
}

function showFeed(type) {
  currentFeed = type
  loadVideos(type)
}

function showUpload() { window.location.href = "upload.html" }
async function logout() { await supabase.auth.signOut(); window.location.href = "auth.html" }

loadVideos('short')
</script>
</body>
</html>
