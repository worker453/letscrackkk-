<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>LetsCrackkk TV</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { background: #0a0a0a; color: white; font-family: Arial; padding: 0; margin: 0; }
    .banner { width: 100%; max-height: 350px; object-fit: cover; border-bottom: 3px solid #0077ff; display: none; }
    .content { padding: 20px; text-align: center; }
    h1 { color: #0077ff; margin-bottom: 5px; }
    p { color: #aaa; margin-top: 0; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; max-width: 1200px; margin: 20px auto; padding: 0 10px; }
    .video { background: #111; padding: 12px; border-radius: 10px; text-align: left; border: 1px solid #222; }
    video { width: 100%; border-radius: 8px; background: black; }
    h3 { font-size: 15px; margin: 8px 0 0 0; color: #ddd; }
  </style>
</head>
<body>
  <img id="banner" class="banner">

  <div class="content">
    <h1>📺 LetsCrackkk TV</h1>
    <p>Watch videos only</p>
    <div id="videoList" class="grid">Loading videos...</div>
  </div>

  <script>
    const SUPABASE_URL = 'https://iprvkotpvdwycmcrjcmy.supabase.co'
    const SUPABASE_ANON_KEY = 'sb_publishable_jIPnwBIXE9zFDcFuoNMGLw_62VrbOJQ'
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

    async function loadVideos() {
      const { data: files, error } = await supabase.storage.from('Videos').list('', { limit: 100, sortBy: { column: 'created_at', order: 'desc' } })
      
      if (error) { document.getElementById('videoList').innerText = 'Error loading videos'; return }
      
      // Banner - first image in bucket
      const imageFile = files.find(f => f.name.match(/\.(jpg|jpeg|png)$/i))
      if(imageFile) {
        const { data } = supabase.storage.from('Videos').getPublicUrl(imageFile.name)
        const banner = document.getElementById('banner')
        banner.src = data.publicUrl
        banner.style.display = 'block'
      }

      const container = document.getElementById('videoList')
      const videoFiles = files.filter(f => f.name.match(/\.(mp4|webm|mov)$/i))
      
      if(videoFiles.length === 0) { container.innerText = 'No videos yet'; return }
      
      container.innerHTML = ''
      videoFiles.forEach(file => {
        const { data } = supabase.storage.from('Videos').getPublicUrl(file.name)
        const title = file.name.replace(/\.[^/.]+$/, "") // removes .mp4
        container.innerHTML += `
          <div class="video">
            <video controls src="${data.publicUrl}"></video>
            <h3>${title}</h3>
          </div>
        `
      })
    }
    loadVideos()
  </script>
</body>
</html>
